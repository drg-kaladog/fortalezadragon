<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guerra de Fortalezas</title>
<style>
:root{--bg:#f1efe8;--ink:#23211c;--panel:#fffdf7;--line:#cfc9b8;--accent:#b8860b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1a;--ink:#ece8da;--panel:#262925;--line:#454a42;--accent:#e0b13a}}
:root[data-theme="dark"]{--bg:#1b1d1a;--ink:#ece8da;--panel:#262925;--line:#454a42;--accent:#e0b13a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;gap:16px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap}
#stage{height:min(92vh,960px);aspect-ratio:9/16;max-width:100%;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#3d6b3a}
canvas{width:100%;height:100%;display:block}
#panel{width:min(340px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:92vh;overflow-y:auto}
h1{font-size:20px;margin:0 0 4px}
p.s{margin:0 0 12px;font-size:13px;opacity:.75;line-height:1.4}
.team{border-top:1px solid var(--line);padding:10px 0}
.team b{display:block;margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
label.f,button{font:inherit;font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
label.f:hover,button:hover{border-color:var(--accent)}
label.f:focus-within,button:focus-visible{outline:2px solid var(--accent)}
select{font:inherit;font-size:13px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label.f input{display:none}
label.f.ok{border-color:var(--accent);font-weight:bold}
.ctl{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:8px 0}
.ctl input{width:150px}
button.main{background:var(--accent);color:#1b1d1a;border-color:var(--accent);font-weight:bold}
#rec{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;opacity:.35}
body.rec #panel{display:none}
body.rec #stage{height:100vh}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="540" height="960"></canvas></div>
<div id="panel">
  <h1>Guerra de Fortalezas</h1>
  <p class="s">Sube tus imágenes (PNG con fondo transparente o GIF) para reemplazar las casas y los personajes de cada equipo.</p>
  <div id="teams"></div>
  <div class="ctl"><span>Cámara sigue a</span><select id="cam"><option value="0">Azul</option><option value="1">Rojo</option></select></div>
  <div class="ctl"><span>Velocidad</span><input id="spd" type="range" min="1" max="4" step="0.5" value="1.5"></div>
  <div class="ctl"><span>Oro por soldado</span><input id="gps" type="range" min="2" max="20" step="1" value="10"></div>
  <div class="row"><button class="main" id="rs">Reiniciar</button><button id="th">Claro/Oscuro</button></div>
</div>
<button id="rec">Modo grabación</button>

let T,over=0,winner='',lastSet={};
const defImg=src=>{const i=new Image();i.src=src;return i};
const DEF=[defImg(SPR.back),defImg(SPR.front)];
function reset(){
  T=[mk('Azul','#4aa3ff',270,840,95,730),mk('Rojo','#ff5a4d',270,120,445,230)];
  for(const i in lastSet)for(const k in lastSet[i])T[i].img[k]=lastSet[i][k];
  over=0;camY=null;
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawnSoldier(t){t.s.push({x:t.fort.x+(Math.random()*40-20),y:t.fort.y+(t===T[0]?-50:50),hp:CFG.sHP,cd:0})}
function update(dt){
  if(over){over-=dt;if(over<=0)reset();return}
  T.forEach((t,i)=>{
    const e=T[1-i];
    t.t+=dt;
    if(t.t>=CFG.workerEvery&&t.w.length<CFG.maxW){t.t=0;t.w.push({x:t.fort.x,y:t.fort.y,st:0,wait:0,at:Math.random()*2})}
    t.w.forEach(w=>{
      w.at=(w.at||0)+dt;
      const tg=w.st===0?t.mine:t.fort;
      if(w.wait>0){w.wait-=dt;return}
      const d=dist(w,tg);
      if(d<28){
        if(w.st===0){w.st=1;w.wait=3;w.at=0}
        else{w.st=0;t.gold++;t.pulse=.3;if(t.gold>=CFG.gold){t.gold-=CFG.gold;spawnSoldier(t)}}
      }else{w.dx=(tg.x-w.x)/d;w.dy=(tg.y-w.y)/d;w.x+=w.dx*110*dt;w.y+=w.dy*110*dt}
    });
    t.s.forEach(s=>{
      s.cd-=dt;
      let tg=null,r=24;
      for(const o of e.s){if(dist(s,o)<90&&(!tg||dist(s,o)<dist(s,tg)))tg=o}
      if(tg){
        if(dist(s,tg)<=r){if(s.cd<=0){tg.hp-=CFG.dmg;s.cd=.6}}
        else{const d=dist(s,tg);s.x+=(tg.x-s.x)/d*60*dt;s.y+=(tg.y-s.y)/d*60*dt}
      }else{
        const d=dist(s,e.fort);
        if(d<70){if(s.cd<=0){e.hp-=CFG.dmg;s.cd=.6}}
        else{s.x+=(e.fort.x-s.x)/d*60*dt;s.y+=(e.fort.y-s.y)/d*60*dt}
      }
    });
  });
  T.forEach(t=>{t.s=t.s.filter(s=>s.hp>0);if(t.pulse>0)t.pulse-=dt});
  T.forEach((t,i)=>{if(t.hp<=0&&!over){over=4.5;winner=T[1-i].name}});
}

for(const k in ATL.anims)ATL.anims[k].img=defImg(ATL.anims[k].src);
let CAM=0,camY=null;
const CA={h:220,th:.5,F:470,cy:430,back:260},cs=Math.cos(CA.th),sn=Math.sin(CA.th);
function PD(l,d,z){
  z=z||0;const dep=d*cs+(CA.h-z)*sn,ver=(z-CA.h)*cs+d*sn,k=CA.F/Math.max(dep,1);
  return {x:270+l*k,y:CA.cy-ver*k,k,d:dep};
}
function P(x,y,z){const fy=CAM?1:-1,rx=CAM?-1:1;return PD((x-270)*rx,(y-camY)*fy+CA.back,z)}
function camUpdate(){
  const t=T[CAM],fy=CAM?1:-1;
  let tg=t.s.length?t.s.reduce((a,s)=>a+s.y,0)/t.s.length:t.fort.y+fy*140;
  const lo=Math.min(t.fort.y,T[1-CAM].fort.y),hi=Math.max(t.fort.y,T[1-CAM].fort.y);
  tg=Math.max(lo,Math.min(hi,tg));
  camY=camY===null?t.fort.y+fy*140:camY+(tg-camY)*0.05;
}
function pic(img,x,y,sz){
  const r=img.width/img.height,w=r>=1?sz:sz*r,h=r>=1?sz/r:sz;
  ctx.drawImage(img,x-w/2,y-h,w,h);
}
function xf(q,f){ctx.save();ctx.translate(q.x,q.y);ctx.scale(q.k,q.k);f();ctx.restore()}
function shadow(rw){ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,0,rw,rw*.35,0,0,7);ctx.fill()}
function drawFort(t,q){xf(q,()=>{
  shadow(80);
  if(t.img.fort){pic(t.img.fort,0,0,150)}
  else{
    ctx.fillStyle='#8a8a84';ctx.fillRect(-60,-80,120,80);
    ctx.fillStyle='#6f6f69';[-70,50].forEach(o=>ctx.fillRect(o,-95,20,95));
    ctx.fillStyle=t.color;ctx.fillRect(-14,-112,28,18);
    ctx.fillStyle='#3b2a1a';ctx.fillRect(-14,-40,28,40);
  }
  ctx.fillStyle='#0008';ctx.fillRect(-70,-140,140,12);
  ctx.fillStyle=t.color;ctx.fillRect(-70,-140,140*Math.max(0,t.hp/CFG.fortHP),12);
})}
function drawMine(t,q){xf(q,()=>{
  ctx.fillStyle='#5b5750';ctx.beginPath();ctx.ellipse(0,0,46,24,0,0,7);ctx.fill();
  ctx.fillStyle='#f2c230';
  [[-14,-4],[8,-9],[14,3],[-6,6]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],8,0,7);ctx.fill()});
  ctx.strokeStyle=t.color;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,52,28,0,0,7);ctx.stroke();
})}
function drawWorker(t,w,q){xf(q,()=>{
  shadow(12);
  if(t.img.worker){pic(t.img.worker,0,0,54)}
  else{
    const fy=CAM?1:-1,rx=CAM?-1:1,f=(w.dy||0)*fy,r=(w.dx||0)*rx;
    const row=Math.abs(f)>=Math.abs(r)?(f>0?2:3):(r>0?0:1);
    const key=w.wait>0?'work':(w.st===1?'walkgold':'walk'),an=ATL.anims[key];
    const fr=Math.floor(((w.at||0)/an.period%1)*an.n)%an.n,s=0.55/ATL.ppu;
    ctx.drawImage(an.img,fr*ATL.cw,row*ATL.ch,ATL.cw,ATL.ch,-ATL.cw*s/2,-ATL.feet*s,ATL.cw*s,ATL.ch*s);
  }
  ctx.fillStyle=t.color;ctx.fillRect(-9,-76,18,4);
  if(w.st===1&&!(w.wait>0)){ctx.fillStyle='#f2c230';ctx.beginPath();ctx.arc(0,-86,6,0,7);ctx.fill();ctx.strokeStyle='#8a6a00';ctx.lineWidth=1.5;ctx.stroke()}
})}
function drawSoldier(t,s,q){xf(q,()=>{
  shadow(16);
  const img=t.img.soldier||(t===T[CAM]?DEF[0]:DEF[1]);
  pic(img,0,0,72);
  ctx.fillStyle='#0008';ctx.fillRect(-14,-82,28,5);
  ctx.fillStyle='#6ddc6d';ctx.fillRect(-14,-82,28*Math.max(0,s.hp/CFG.sHP),5);
})}
function ground(){
  const hz=CA.cy-CA.F*Math.tan(CA.th),fy=CAM?1:-1;
  const g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#4f9ae0');g.addColorStop(1,'#d6ecf8');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+1);
  ctx.fillStyle='#3d6b3a';ctx.fillRect(0,hz,W,H-hz);
  ctx.fillStyle='#46763f';
  for(let wy=-1400;wy<2400;wy+=120){
    if((wy/120)&1)continue;
    let d1=(wy-camY)*fy+CA.back,d2=(wy+120-camY)*fy+CA.back;
    d1=Math.max(d1,-80);d2=Math.max(d2,-80);if(d1===d2)continue;
    const a=PD(-1500,d1),b=PD(1500,d1),c=PD(1500,d2),e=PD(-1500,d2);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(e.x,e.y);ctx.fill();
  }
}
function draw(){
  camUpdate();ground();
  const L=[];
  T.forEach(t=>{
    const m=P(t.mine.x,t.mine.y);L.push([m.d,()=>drawMine(t,m)]);
    const f=P(t.fort.x,t.fort.y);L.push([f.d,()=>drawFort(t,f)]);
    t.w.forEach(w=>{const q=P(w.x,w.y);L.push([q.d,()=>drawWorker(t,w,q)])});
    t.s.forEach(s=>{const q=P(s.x,s.y);L.push([q.d,()=>drawSoldier(t,s,q)])});
  });
  L.filter(a=>a[0]>25).sort((a,b)=>b[0]-a[0]).forEach(a=>a[1]());
  T.forEach((t,i)=>{
    const y=i===CAM?H-34:34;
    ctx.fillStyle='#000a';ctx.fillRect(170,y-14,200,28);
    ctx.fillStyle='#f2c230';ctx.fillRect(172,y-12,196*Math.min(1,t.gold/CFG.gold),24);
    ctx.fillStyle='#fff';ctx.font='bold 16px Trebuchet MS';ctx.textAlign='center';
    ctx.fillText(t.name+'  oro '+t.gold+'/'+CFG.gold+'  ·  soldados '+t.s.length,270,y+5);
  });
  if(over){
    ctx.fillStyle='#000b';ctx.fillRect(0,H/2-90,W,180);
    ctx.fillStyle='#fff';ctx.font='bold 46px Trebuchet MS';ctx.textAlign='center';
    ctx.fillText('¡Gana el equipo '+winner+'!',W/2,H/2+10);
    ctx.font='20px Trebuchet MS';ctx.fillText('Reiniciando…',W/2,H/2+52);
  }
}
let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000)*CFG.speed;last=n;
  update(dt);draw();requestAnimationFrame(loop);
}
// UI
const names={fort:'Fortaleza',worker:'Recolector',soldier:'Soldado'};
const box=document.getElementById('teams');
[0,1].forEach(i=>{
  const d=document.createElement('div');d.className='team';
  d.innerHTML='<b>Equipo '+(i?'Rojo':'Azul')+'</b><div class="row"></div>';
  const row=d.querySelector('.row');
  Object.keys(names).forEach(k=>{
    const l=document.createElement('label');l.className='f';
    l.innerHTML=names[k]+'<input type="file" accept="image/*">';
    l.querySelector('input').onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=()=>{const im=new Image();im.onload=()=>{
        T[i].img[k]=im;(lastSet[i]=lastSet[i]||{})[k]=im;l.classList.add('ok')};im.src=r.result};
      r.readAsDataURL(f);
    };
    row.appendChild(l);
  });
  box.appendChild(d);
});
document.getElementById('spd').oninput=e=>CFG.speed=+e.target.value;
document.getElementById('cam').onchange=e=>{CAM=+e.target.value;camY=null};
document.getElementById('gps').oninput=e=>CFG.gold=+e.target.value;
document.getElementById('rs').onclick=()=>reset();
document.getElementById('th').onclick=()=>{
  const r=document.documentElement,dark=matchMedia('(prefers-color-scheme:dark)').matches;
  const cur=r.dataset.theme||(dark?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';
};
const rec=document.getElementById('rec');
rec.onclick=()=>{document.body.classList.toggle('rec');rec.textContent=document.body.classList.contains('rec')?'Mostrar panel':'Modo grabación'};
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
