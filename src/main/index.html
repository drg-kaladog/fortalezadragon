<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guerra de Fortalezas</title>
<style>
:root{--bg:#f1efe8;--ink:#23211c;--panel:#fffdf7;--line:#cfc9b8;--accent:#b8860b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1a;--ink:#ece8da;--panel:#262925;--line:#454a42;--accent:#e0b13a}}
:root[data-theme="dark"]{--bg:#1b1d1a;--ink:#ece8da;--panel:#262925;--line:#454a42;--accent:#e0b13a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;gap:16px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap}
#stage{height:min(92vh,960px);aspect-ratio:9/16;max-width:100%;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#3d6b3a}
canvas{width:100%;height:100%;display:block}
#panel{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:92vh;overflow-y:auto}
h1{font-size:20px;margin:0 0 4px}
p.s{margin:0 0 12px;font-size:13px;opacity:.75;line-height:1.4}
.team{border-top:1px solid var(--line);padding:10px 0}
.team b{display:block;margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
label.f,button{font:inherit;font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
label.f:hover,button:hover{border-color:var(--accent)}
label.f:focus-within,button:focus-visible{outline:2px solid var(--accent)}
select,input[type="text"]{font:inherit;font-size:12px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
label.f input[type="file"]{display:none}
label.f.ok{border-color:var(--accent);font-weight:bold}
.ctl{display:flex;flex-direction:column;gap:4px;font-size:13px;margin:8px 0}
.ctl-row{display:flex;justify-content:space-between;align-items:center}
.ctl-row input[type="range"]{width:150px}
button.main{background:var(--accent);color:#1b1d1a;border-color:var(--accent);font-weight:bold}
#rec{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;opacity:.35}
body.rec #panel{display:none}
body.rec #stage{height:100vh}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="540" height="960"></canvas></div>
<div id="panel">
  <h1>Guerra de Fortalezas</h1>
  <p class="s">Configura las rutas de tus modelos o imágenes (PNG/GIF) para las estructuras y unidades.</p>
  
  <div class="ctl">
    <span>Ruta Castillo (Barracks):</span>
    <input type="text" id="path-castle" value="src/main/modelos/casas/hBarracks/hBarracks.png">
  </div>
  <div class="ctl">
    <span>Ruta Mina de Oro:</span>
    <input type="text" id="path-mine" value="src/main/modelos/oromine/oromine.png">
  </div>
  <div class="ctl">
    <span>Ruta Peón (Worker):</span>
    <input type="text" id="path-peasant" value="src/main/modelos/peasant/hPeasant/Peasant.png">
  </div>

  <div id="teams"></div>

  <div class="ctl ctl-row"><span>Cámara sigue a</span><select id="cam"><option value="0">Azul</option><option value="1">Rojo</option></select></div>
  <div class="ctl ctl-row"><span>Velocidad</span><input id="spd" type="range" min="1" max="4" step="0.5" value="1.5"></div>
  <div class="ctl ctl-row"><span>Oro por soldado</span><input id="gps" type="range" min="2" max="20" step="1" value="10"></div>
  <div class="row" style="margin-top:10px;"><button class="main" id="rs">Aplicar / Reiniciar</button><button id="th">Claro/Oscuro</button></div>
</div>
<button id="rec">Modo grabación</button>
